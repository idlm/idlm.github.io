name: Build Hexo (verify only)

# This workflow only builds the site to verify that source changes
# do not break the build. It does NOT deploy to master. The local
# `ghs` command (and manual `git push origin HEAD:master` from the
# build machine) handles the actual publish, because GitHub-hosted
# actions have been unreliable at pushing to the user site repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # `npm ci` is strict about package.json/lockfile drift; fall back
        # to `npm install` (still lockfile-driven, but tolerant).
        run: |
          if npm ci --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci failed, retrying with npm install"
            npm install --no-audit --no-fund
          fi

      - name: Generate static site
        run: npx hexo generate

      - name: Verify output
        run: |
          echo "--- artifact root ---"
          ls -la public/ | head -20
          echo "--- index.html exists? ---"
          test -f public/index.html && echo "yes, size: $(wc -c < public/index.html) bytes" || echo "no"
          echo "--- exit 0 always; build itself is the main signal ---"
          exit 0
