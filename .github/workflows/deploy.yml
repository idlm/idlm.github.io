name: Deploy Hexo to GitHub Pages

# Triggers:
#   - push to main: full deploy (build + push to master)
#   - workflow_dispatch: manual rerun from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

# Default: read repo contents, write nothing.
# hexo-deployer-git pushes to the `master` branch of the SAME repo, so we
# need a one-time elevation. We use a fine-grained deploy key stored in
# the DEPLOY_KEY secret (an SSH private key with write access to
# idlm/idlm.github.io).
permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history helps hexo lastmod detection

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # `npm ci` is strict about package.json/lockfile drift; fall back
        # to `npm install` (still lockfile-driven, but tolerant) for the
        # rare case where a transitive drift slipped in.
        run: |
          if npm ci --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci failed, retrying with npm install"
            npm install --no-audit --no-fund
          fi

      - name: Generate static site
        run: npx hexo generate

      - name: Prepare deploy artifact
        run: |
          # The hexo output directory is `public/`. We copy its contents
          # into a clean directory at the repo root, so we can publish it
          # to master without dragging source files along.
          mkdir -p _site
          cp -r public/. _site/
          # write a .nojekyll so GitHub Pages doesn't try to process our
          # files with Jekyll (which would mangle underscore-prefixed dirs)
          touch _site/.nojekyll
          echo "--- artifact listing ---"
          find _site -type f | head -20
          echo "--- index.html size (sanity check) ---"
          ls -la _site/index.html

      - name: Push master via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git init -q
          git remote add origin "git@github.com:idlm/idlm.github.io.git"
          # Use --reference to leverage the source checkout's objects
          # (avoids re-uploading unchanged blobs from the artifact).
          git fetch -q --depth=1 origin master
          git checkout -q --orphan _site_master
          git rm -rfq . 2>/dev/null || true
          cp -r /root/blog/_site/. .
          git add -A
          git commit -q -m "deploy: ${GITHUB_SHA::7}" \
            -m "Triggered by ${GITHUB_WORKFLOW} @ ${GITHUB_SHA}"
          git push -f origin HEAD:master
          cd /root/blog
          rm -rf "$TMPDIR"
